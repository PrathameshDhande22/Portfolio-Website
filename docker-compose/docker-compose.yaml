name: Portfolio

services:
  strapi-cms:
    container_name: strapi-cms
    image: ${REGISTRY}/portfolio/strapi-cms:latest
    restart: unless-stopped
    pull_policy: always
    cpus: 0.6
    mem_limit: 448m
    mem_reservation: 384m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    environment:
      - APP_KEYS=${APP_KEYS}
      - API_TOKEN_SALT=${API_TOKEN_SALT}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - STRAPI_TELEMETRY_DISABLED=true
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=portfolio-cms
      - DATABASE_USERNAME=prathamesh
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_CLIENT=postgres
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_ACCESS_SECRET=${AWS_ACCESS_SECRET}
      - AWS_REGION=${AWS_REGION}
      - AWS_BUCKET=${AWS_BUCKET_NAME}
      - AWS_ENDPOINT=${AWS_ENDPOINT}
      - ASSISTANT_URL=https://ai-assistant.prathameshdhande.com
      - ASSISTANT_SECRET=${ASSISTANT_SECRET}
      - CLIENT_URL=https://prathameshdhande.com
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=465
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SECURE=true
      - SMTP_FROM=no-reply@portfolio.prathameshdhande.com
      - SMTP_REPLYTO=prathameshdhande534@gmail.com
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.strapi.rule=Host(`cms.prathameshdhande.com`)
      - traefik.http.routers.strapi.entrypoints=https,http
      - traefik.http.routers.strapi.tls=true
      - traefik.http.routers.strapi.tls.certresolver=spaceship
      - traefik.http.routers.strapi.middlewares=strapi-limit
      - traefik.http.middlewares.strapi-limit.buffering.maxRequestBodyBytes=104857600
      - traefik.http.services.strapi-cms-service.loadbalancer.server.port=1337
      - traefik.http.routers.strapi.service=strapi-cms-service
    networks:
      - proxy
      - pg-database

  ai-assistant:
    image: ${REGISTRY}/portfolio/ai-assistant:latest
    container_name: ai-assistant
    restart: unless-stopped
    pull_policy: always
    cpus: 0.4
    mem_limit: 384m
    mem_reservation: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    environment:
      - ENVIRONMENT=production
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - OPENAI_API_VERSION=${OPENAI_API_VERSION}
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING}
      - STRAPI_API_URL=https://cms.prathameshdhande.com/api
      - STRAPI_AUTH_TOKEN=${STRAPI_API_TOKEN}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_TRACING=true
      - LANGSMITH_PROJECT=Portfolio-AI-Assistant
      - CLIENT_SECRET=${ASSISTANT_SECRET}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.assistant.rule=Host(`assistant.prathameshdhande.com`)
      - traefik.http.routers.assistant.entrypoints=https,http
      - traefik.http.routers.assistant.tls=true
      - traefik.http.routers.assistant.tls.certresolver=spaceship
      - traefik.http.routers.assistant.middlewares=assistant-limit
      - traefik.http.services.assistant-service.loadbalancer.server.port=8000
      - traefik.http.routers.assistant.service=assistant-service
    networks:
      - proxy
      - pg-database

networks:
  proxy: 
    external: true
  pg-database:
    external: true