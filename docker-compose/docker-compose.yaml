name: Portfolio

services:
  strapi-cms:
    container_name: strapi-cms
    image: ${REGISTRY}/portfolio/strapi-cms:latest
    restart: unless-stopped
    pull_policy: always
    cpus: 0.6
    mem_limit: 448m
    mem_reservation: 384m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    environment:
      - APP_KEYS=${APP_KEYS}
      - API_TOKEN_SALT=${API_TOKEN_SALT}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - STRAPI_TELEMETRY_DISABLED=true
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=portfolio-cms
      - DATABASE_USERNAME=prathamesh
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_CLIENT=postgres
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_ACCESS_SECRET=${AWS_ACCESS_SECRET}
      - AWS_REGION=${AWS_REGION}
      - AWS_BUCKET=${AWS_BUCKET_NAME}
      - AWS_ENDPOINT=${AWS_ENDPOINT}
      - ASSISTANT_URL=https://assistant.prathameshdhande.com
      - ASSISTANT_SECRET=${ASSISTANT_SECRET}
      - CLIENT_URL=https://prathameshdhande.com
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=465
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SECURE=true
      - SMTP_FROM=no-reply@portfolio.prathameshdhande.com
      - SMTP_REPLYTO=prathameshdhande534@gmail.com
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.strapi.rule=Host(`cms.prathameshdhande.com`)
      - traefik.http.routers.strapi.entrypoints=https
      - traefik.http.routers.strapi.tls=true
      - traefik.http.routers.strapi.tls.certresolver=spaceship
      - traefik.http.routers.strapi.middlewares=strapi-limit
      - traefik.http.middlewares.strapi-limit.buffering.maxRequestBodyBytes=104857600
      - traefik.http.services.strapi-cms-service.loadbalancer.server.port=1337
      - traefik.http.routers.strapi.service=strapi-cms-service
    networks:
      - proxy
      - pg-database

  client:
    container_name: portfolio-client
    image: ${REGISTRY}/portfolio/portfolio-client:latest
    restart: unless-stopped
    pull_policy: always
    cpus: 0.5
    mem_limit: 384m
    mem_reservation: 320m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    environment:
      - BASE_URL=https://cms.prathameshdhande.com/api
      - API_TOKEN=${STRAPI_API_TOKEN}
      - SITE_URL=https://prathameshdhande.com
      - MEDIA_URL=${AWS_ENDPOINT}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
      - ASSISTANT_URL=https://assistant.prathameshdhande.com
      - ASSISTANT_SECRET=${ASSISTANT_SECRET}
      - GOOGLE_VERIFICATION=${GOOGLE_SITE_VERIFICATION}
      - GA_MEASUREMENT_ID=${GA_MEASUREMENT_ID}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.client.rule=Host(`prathameshdhande.com`) || Host(`www.prathameshdhande.com`)
      - traefik.http.routers.client.entrypoints=https
      - traefik.http.routers.client.tls=true
      - traefik.http.routers.client.tls.certresolver=spaceship
      - traefik.http.routers.client.tls.domains[0].main=prathameshdhande.com
      - traefik.http.routers.client.tls.domains[0].sans=www.prathameshdhande.com
      - traefik.http.services.portfolio-client-service.loadbalancer.server.port=3000
      - traefik.http.routers.client.service=portfolio-client-service
    networks:
      - proxy

networks:
  proxy:
    external: true
  pg-database:
    external: true
