[project]
name = "assistant"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-azure-ai>=1.2.3",
    "langchain-google-genai>=4.3.2",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.4.1",
    "langchain-pdfmuse>=0.1.0",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.2",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
]

[tool.fastapi]
entrypoint = "app:app"

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
]
